  <body>
    <h1>Core Rules</h1>
    <ul>
      <li>🐍 Snake vs. 💧 Water: Snake drinks the water, so Snake wins.</li>
      <li>🔫 Gun vs. 🐍 Snake: Gun shoots the snake, so Gun wins.</li>
      <li>
        💧 Water vs. 🔫 Gun: Water douses (drowns) the gun, so Water wins.
      </li>
      <li>
        <b>Draw: </b> If both players choose the same item, the round is a draw.
      </li>
    </ul>
    <button class="btn">Start The Game</button>
  </body>
